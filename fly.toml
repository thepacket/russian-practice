# Two auto-stopping machines in Toronto; always deploy to yyz.
app = "russian-practice"
primary_region = "yyz"
kill_signal = "SIGQUIT"
kill_timeout = "5s"
[build]
  dockerfile = "Dockerfile"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
