server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 1k;
  gzip on;
  gzip_types application/json text/css application/javascript text/javascript application/manifest+json;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy 'microphone=(self), camera=(), geolocation=()' always;
  add_header Strict-Transport-Security 'max-age=31536000' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://eastus.api.cognitive.microsoft.com wss://eastus.tts.speech.microsoft.com wss://eastus.stt.speech.microsoft.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  add_header Cache-Control 'no-cache' always;
  location = /healthz { return 200 'ok'; }
  location /api/ { return 404; }
  location / { limit_except GET { deny all; } try_files $uri $uri/ /index.html; }
}
